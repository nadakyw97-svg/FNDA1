<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS 일별/상품별 판매 실적 대시보드</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js for visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(229, 231, 235, 0.8);
        }
        /* Custom scrollbar for tables */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <header class="bg-indigo-900 text-white shadow-lg border-b border-indigo-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <div class="p-2 bg-indigo-700/60 rounded-lg border border-indigo-500/30">
                        <i data-lucide="shopping-bag" class="w-7 h-7 text-indigo-200"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-tight text-white">POS 일별 / 상품별 판매 대시보드</h1>
                        <p class="text-xs text-indigo-200 mt-0.5">실시간 매출 분석 및 상품별 트렌드 리포트</p>
                    </div>
                </div>
                
                <!-- CSV File Upload & Action Controls -->
                <div class="flex items-center gap-3">
                    <label class="cursor-pointer inline-flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg shadow-sm transition border border-indigo-400/30">
                        <i data-lucide="upload" class="w-4 h-4 mr-2"></i>
                        <span>CSV 파일 업로드</span>
                        <input type="file" id="csvFileInput" accept=".csv" class="hidden">
                    </label>
                    <button id="resetDemoBtn" class="inline-flex items-center px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded-lg transition border border-slate-700" title="기본 샘플 데이터로 복원">
                        <i data-lucide="refresh-cw" class="w-4 h-4 mr-1.5"></i>
                        <span>샘플 복원</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <section class="glass-card rounded-2xl p-5 shadow-sm space-y-4">
            <div class="flex items-center justify-between border-b border-slate-200/80 pb-3">
                <div class="flex items-center space-x-2">
                    <i data-lucide="filter" class="w-5 h-5 text-indigo-600"></i>
                    <h2 class="font-semibold text-slate-700">조회 필터 설정</h2>
                </div>
                <span id="dataCountBadge" class="text-xs font-semibold px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-full border border-indigo-100">
                    데이터 로딩 중...
                </span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                <!-- Date Selector Filter -->
                <div>
                    <label for="dateSelect" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">
                        조회 일자 (-YYYY-MM-DD)
                    </label>
                    <select id="dateSelect" class="w-full bg-white border border-slate-300 text-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm transition">
                        <option value="ALL">전체 날짜</option>
                    </select>
                </div>

                <!-- Store Filter -->
                <div>
                    <label for="storeSelect" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">
                        점포 선택
                    </label>
                    <select id="storeSelect" class="w-full bg-white border border-slate-300 text-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm transition">
                        <option value="ALL">전체 점포</option>
                    </select>
                </div>

                <!-- Category Filter -->
                <div>
                    <label for="categorySelect" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">
                        카테고리
                    </label>
                    <select id="categorySelect" class="w-full bg-white border border-slate-300 text-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm transition">
                        <option value="ALL">전체 카테고리</option>
                    </select>
                </div>

                <!-- Promotion Filter -->
                <div>
                    <label for="promoSelect" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">
                        행사 적용 여부
                    </label>
                    <select id="promoSelect" class="w-full bg-white border border-slate-300 text-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm transition">
                        <option value="ALL">전체 (행사 / 정상)</option>
                        <option value="Y">행사 적용 (Y)</option>
                        <option value="N">정상 판매 (N)</option>
                    </select>
                </div>

                <!-- Product Search Filter -->
                <div>
                    <label for="searchInput" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">
                        상품명 / 코드 검색
                    </label>
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="검색어 입력..." class="w-full bg-white border border-slate-300 text-slate-700 rounded-lg p-2.5 pl-9 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm transition">
                        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
                    </div>
                </div>
            </div>
        </section>

        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
            <!-- Total Sales Card -->
            <div class="glass-card rounded-2xl p-5 shadow-sm border-l-4 border-l-indigo-600 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">총 매출액</p>
                    <h3 id="statTotalRevenue" class="text-2xl font-extrabold text-slate-800 mt-1">₩0</h3>
                    <p class="text-xs text-indigo-600 mt-1 flex items-center font-medium">
                        <i data-lucide="trending-up" class="w-3.5 h-3.5 mr-1"></i> 실적 합계
                    </p>
                </div>
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center">
                    <i data-lucide="dollar-sign" class="w-6 h-6"></i>
                </div>
            </div>

            <!-- Total Quantity Card -->
            <div class="glass-card rounded-2xl p-5 shadow-sm border-l-4 border-l-blue-600 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">총 판매수량</p>
                    <h3 id="statTotalQuantity" class="text-2xl font-extrabold text-slate-800 mt-1">0개</h3>
                    <p class="text-xs text-blue-600 mt-1 flex items-center font-medium">
                        <i data-lucide="package" class="w-3.5 h-3.5 mr-1"></i> 누적 판매량
                    </p>
                </div>
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center">
                    <i data-lucide="shopping-cart" class="w-6 h-6"></i>
                </div>
            </div>

            <!-- Total Discount Card -->
            <div class="glass-card rounded-2xl p-5 shadow-sm border-l-4 border-l-rose-500 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">총 할인액</p>
                    <h3 id="statTotalDiscount" class="text-2xl font-extrabold text-slate-800 mt-1">₩0</h3>
                    <p class="text-xs text-rose-500 mt-1 flex items-center font-medium">
                        <i data-lucide="tag" class="w-3.5 h-3.5 mr-1"></i> 행사 할인 프로모션
                    </p>
                </div>
                <div class="w-12 h-12 bg-rose-50 text-rose-600 rounded-xl flex items-center justify-center">
                    <i data-lucide="percent" class="w-6 h-6"></i>
                </div>
            </div>

            <!-- Average Transaction/Item Card -->
            <div class="glass-card rounded-2xl p-5 shadow-sm border-l-4 border-l-emerald-500 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">평균 단가 (개당)</p>
                    <h3 id="statAvgPrice" class="text-2xl font-extrabold text-slate-800 mt-1">₩0</h3>
                    <p class="text-xs text-emerald-600 mt-1 flex items-center font-medium">
                        <i data-lucide="bar-chart-2" class="w-3.5 h-3.5 mr-1"></i> 평균 단가 수준
                    </p>
                </div>
                <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center">
                    <i data-lucide="pie-chart" class="w-6 h-6"></i>
                </div>
            </div>
        </section>

        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Line Chart: Sales Trend -->
            <div class="lg:col-span-2 glass-card rounded-2xl p-5 shadow-sm flex flex-col justify-between">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="line-chart" class="w-5 h-5 text-indigo-600"></i>
                        날짜별 매출 트렌드
                    </h3>
                    <span class="text-xs text-slate-500">일자별 매출 추이</span>
                </div>
                <div class="relative w-full h-72">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <!-- Doughnut Chart: Category Share -->
            <div class="glass-card rounded-2xl p-5 shadow-sm flex flex-col justify-between">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="pie-chart" class="w-5 h-5 text-indigo-600"></i>
                        카테고리별 매출 비중
                    </h3>
                    <span class="text-xs text-slate-500">점유율</span>
                </div>
                <div class="relative w-full h-72 flex items-center justify-center">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </section>

        <section class="glass-card rounded-2xl p-5 shadow-sm space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 border-b border-slate-200/80 pb-3">
                <div>
                    <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                        <i data-lucide="table" class="w-5 h-5 text-indigo-600"></i>
                        상세 판매 명세서
                    </h3>
                    <p class="text-xs text-slate-500 mt-0.5">선택한 필터 조건에 따른 개별 판매 내역</p>
                </div>
                <div class="flex items-center gap-2">
                    <span id="tableSummaryText" class="text-xs text-slate-500">총 0건 조회됨</span>
                </div>
            </div>

            <!-- Table -->
            <div class="overflow-x-auto rounded-xl border border-slate-200">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100/80 text-slate-600 uppercase text-xs font-semibold tracking-wider border-b border-slate-200">
                            <th class="py-3 px-4">일자</th>
                            <th class="py-3 px-4">점포</th>
                            <th class="py-3 px-4">카테고리</th>
                            <th class="py-3 px-4">상품코드</th>
                            <th class="py-3 px-4">상품명</th>
                            <th class="py-3 px-4 text-right">정상단가</th>
                            <th class="py-3 px-4 text-right">판매수량</th>
                            <th class="py-3 px-4 text-right">할인액</th>
                            <th class="py-3 px-4 text-right">매출액</th>
                            <th class="py-3 px-4 text-center">행사</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody" class="divide-y divide-slate-200 bg-white">
                        <!-- Dynamic Row Rendering -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination Controls -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-3 pt-2">
                <div class="text-xs text-slate-500">
                    페이지 <span id="currentPageText" class="font-semibold text-slate-700">1</span> / <span id="totalPagesText" class="font-semibold text-slate-700">1</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="prevPageBtn" class="px-3 py-1.5 text-xs font-medium bg-white border border-slate-300 text-slate-600 rounded-lg hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed transition">
                        이전
                    </button>
                    <button id="nextPageBtn" class="px-3 py-1.5 text-xs font-medium bg-white border border-slate-300 text-slate-600 rounded-lg hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed transition">
                        다음
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script>
        // Sample Mock Data matching user CSV format with dates as `-YYYY-MM-DD`
        const DEFAULT_MOCK_DATA = [
            { "일자": "-2026-08-01", "점포": "센트럴점", "카테고리": "냉장 간편식", "상품코드": "RM-101", "상품명": "한끼 소불고기덮밥", "판매수량": 44, "정상단가": 5900, "할인액": 0, "매출액": 259600, "행사적용": "N" },
            { "일자": "-2026-08-01", "점포": "센트럴점", "카테고리": "냉장 간편식", "상품코드": "RM-102", "상품명": "매콤 닭갈비볶음밥", "판매수량": 49, "정상단가": 5500, "할인액": 0, "매출액": 269500, "행사적용": "N" },
            { "일자": "-2026-08-01", "점포": "센트럴점", "카테고리": "냉장 간편식", "상품코드": "RM-103", "상품명": "훈제오리 샐러드랩", "판매수량": 58, "정상단가": 6200, "할인액": 0, "매출액": 359600, "행사적용": "N" },
            { "일자": "-2026-08-01", "점포": "강남점", "카테고리": "음료/디저트", "상품코드": "DR-201", "상품명": "아이스 아메리카노", "판매수량": 120, "정상단가": 3000, "할인액": 30000, "매출액": 330000, "행사적용": "Y" },
            { "일자": "-2026-08-01", "점포": "강남점", "카테고리": "음료/디저트", "상품코드": "DR-202", "상품명": "생딸기 라떼", "판매수량": 35, "정상단가": 4500, "할인액": 0, "매출액": 157500, "행사적용": "N" },
            { "일자": "-2026-08-02", "점포": "센트럴점", "카테고리": "냉장 간편식", "상품코드": "RM-101", "상품명": "한끼 소불고기덮밥", "판매수량": 52, "정상단가": 5900, "할인액": 31200, "매출액": 275600, "행사적용": "Y" },
            { "일자": "-2026-08-02", "점포": "홍대점", "카테고리": "베이커리", "상품코드": "BK-301", "상품명": "크루아상 버터세트", "판매수량": 80, "정상단가": 3800, "할인액": 0, "매출액": 304000, "행사적용": "N" },
            { "일자": "-2026-08-02", "점포": "강남점", "카테고리": "음료/디저트", "상품코드": "DR-201", "상품명": "아이스 아메리카노", "판매수량": 110, "정상단가": 3000, "할인액": 0, "매출액": 330000, "행사적용": "N" },
            { "일자": "-2026-08-03", "점포": "홍대점", "카테고리": "베이커리", "상품코드": "BK-302", "상품명": "초코 소금빵", "판매수량": 65, "정상단가": 3200, "할인액": 6500, "매출액": 201500, "행사적용": "Y" },
            { "일자": "-2026-08-03", "점포": "센트럴점", "카테고리": "냉장 간편식", "상품코드": "RM-104", "상품명": "우삼겹 된장찌개", "판매수량": 40, "정상단가": 6800, "할인액": 0, "매출액": 272000, "행사적용": "N" },
            { "일자": "-2026-08-04", "점포": "강남점", "카테고리": "냉장 간편식", "상품코드": "RM-105", "상품명": "새우 로제파스타", "판매수량": 50, "정상단가": 7200, "할인액": 10000, "매출액": 350000, "행사적용": "Y" },
            { "일자": "-2026-08-04", "점포": "홍대점", "카테고리": "음료/디저트", "상품코드": "DR-203", "상품명": "망고 스무디", "판매수량": 45, "정상단가": 5000, "할인액": 0, "매출액": 225000, "행사적용": "N" }
        ];

        // Application State
        let rawData = [...DEFAULT_MOCK_DATA];
        let filteredData = [];
        let currentPage = 1;
        const pageSize = 10;

        // Chart instances
        let trendChart = null;
        let categoryChart = null;

        // Initialize Icons & App
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initCharts();
            setupEventListeners();
            loadData(rawData);
        });

        function initCharts() {
            // Trend Line Chart
            const ctxTrend = document.getElementById('trendChart').getContext('2d');
            trendChart = new Chart(ctxTrend, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '매출액 (원)',
                        data: [],
                        borderColor: '#4f46e5',
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (context) => `매출액: ₩${context.parsed.y.toLocaleString()}`
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: (val) => '₩' + (val / 10000).toLocaleString() + '만'
                            }
                        }
                    }
                }
            });

            // Category Doughnut Chart
            const ctxCat = document.getElementById('categoryChart').getContext('2d');
            categoryChart = new Chart(ctxCat, {
                type: 'doughnut',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: [
                            '#6366f1', '#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6'
                        ],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: {
                            callbacks: {
                                label: (context) => `${context.label}: ₩${context.parsed.toLocaleString()}`
                            }
                        }
                    }
                }
            });
        }

        function loadData(data) {
            // Normalize Date format to maintain "-YYYY-MM-DD"
            rawData = data.map(item => {
                let dateStr = String(item['일자'] || '').trim();
                // Ensure leading dash if user uploaded plain YYYY-MM-DD
                if (dateStr && !dateStr.startsWith('-') && /^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                    dateStr = '-' + dateStr;
                }
                return {
                    "일자": dateStr,
                    "점포": String(item['점포'] || '미지정').trim(),
                    "카테고리": String(item['카테고리'] || '기타').trim(),
                    "상품코드": String(item['상품코드'] || '-').trim(),
                    "상품명": String(item['상품명'] || '미지정').trim(),
                    "판매수량": Number(item['판매수량'] || 0),
                    "정상단가": Number(item['정상단가'] || 0),
                    "할인액": Number(item['할인액'] || 0),
                    "매출액": Number(item['매출액'] || 0),
                    "행사적용": String(item['행사적용'] || 'N').trim().toUpperCase()
                };
            });

            populateFilterDropdowns();
            applyFilters();
        }

        function populateFilterDropdowns() {
            const dates = [...new Set(rawData.map(d => d['일자']))].sort();
            const stores = [...new Set(rawData.map(d => d['점포']))].sort();
            const categories = [...new Set(rawData.map(d => d['카테고리']))].sort();

            const dateSelect = document.getElementById('dateSelect');
            const storeSelect = document.getElementById('storeSelect');
            const categorySelect = document.getElementById('categorySelect');

            // Reset options
            dateSelect.innerHTML = '<option value="ALL">전체 날짜</option>';
            stores.length && (storeSelect.innerHTML = '<option value="ALL">전체 점포</option>');
            categories.length && (categorySelect.innerHTML = '<option value="ALL">전체 카테고리</option>');

            dates.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d; // Displays in -YYYY-MM-DD format
                dateSelect.appendChild(opt);
            });

            stores.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                storeSelect.appendChild(opt);
            });

            categories.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                categorySelect.appendChild(opt);
            });
        }

        function applyFilters() {
            const selectedDate = document.getElementById('dateSelect').value;
            const selectedStore = document.getElementById('storeSelect').value;
            const selectedCategory = document.getElementById('categorySelect').value;
            const selectedPromo = document.getElementById('promoSelect').value;
            const searchText = document.getElementById('searchInput').value.toLowerCase().trim();

            filteredData = rawData.filter(item => {
                const matchDate = selectedDate === 'ALL' || item['일자'] === selectedDate;
                const matchStore = selectedStore === 'ALL' || item['점포'] === selectedStore;
                const matchCat = selectedCategory === 'ALL' || item['카테고리'] === selectedCategory;
                const matchPromo = selectedPromo === 'ALL' || item['행사적용'] === selectedPromo;
                const matchSearch = !searchText || 
                    item['상품명'].toLowerCase().includes(searchText) || 
                    item['상품코드'].toLowerCase().includes(searchText);

                return matchDate && matchStore && matchCat && matchPromo && matchSearch;
            });

            currentPage = 1;
            updateDashboard();
        }

        function updateDashboard() {
            // Update Summary Badges
            document.getElementById('dataCountBadge').textContent = `총 ${filteredData.length.toLocaleString()}건 데이터`;

            // Calculate Metrics
            let totalRevenue = 0;
            let totalQuantity = 0;
            let totalDiscount = 0;

            filteredData.forEach(d => {
                totalRevenue += d['매출액'];
                totalQuantity += d['판매수량'];
                totalDiscount += d['할인액'];
            });

            const avgPrice = totalQuantity > 0 ? Math.round(totalRevenue / totalQuantity) : 0;

            // Render Metrics
            document.getElementById('statTotalRevenue').textContent = `₩${totalRevenue.toLocaleString()}`;
            document.getElementById('statTotalQuantity').textContent = `${totalQuantity.toLocaleString()}개`;
            document.getElementById('statTotalDiscount').textContent = `₩${totalDiscount.toLocaleString()}`;
            document.getElementById('statAvgPrice').textContent = `₩${avgPrice.toLocaleString()}`;

            // Render Charts
            updateCharts();

            // Render Table
            renderTable();
        }

        function updateCharts() {
            // 1. Sales Trend by Date
            const trendMap = {};
            filteredData.forEach(d => {
                trendMap[d['일자']] = (trendMap[d['일자']] || 0) + d['매출액'];
            });

            const sortedDates = Object.keys(trendMap).sort();
            const trendValues = sortedDates.map(date => trendMap[date]);

            trendChart.data.labels = sortedDates;
            trendChart.data.datasets[0].data = trendValues;
            trendChart.update();

            // 2. Sales Share by Category
            const catMap = {};
            filteredData.forEach(d => {
                catMap[d['카테고리']] = (catMap[d['카테고리']] || 0) + d['매출액'];
            });

            const catLabels = Object.keys(catMap);
            const catValues = catLabels.map(cat => catMap[cat]);

            categoryChart.data.labels = catLabels;
            categoryChart.data.datasets[0].data = catValues;
            categoryChart.update();
        }

        function renderTable() {
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = '';

            const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
            document.getElementById('currentPageText').textContent = currentPage;
            document.getElementById('totalPagesText').textContent = totalPages;
            document.getElementById('tableSummaryText').textContent = `총 ${filteredData.length.toLocaleString()}건 중 ${Math.min((currentPage - 1) * pageSize + 1, filteredData.length)}-${Math.min(currentPage * pageSize, filteredData.length)}건 표시`;

            document.getElementById('prevPageBtn').disabled = currentPage === 1;
            document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;

            const startIdx = (currentPage - 1) * pageSize;
            const pageData = filteredData.slice(startIdx, startIdx + pageSize);

            if (pageData.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="10" class="py-8 text-center text-slate-400">
                            조회된 데이터가 없습니다.
                        </td>
                    </tr>
                `;
                return;
            }

            pageData.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition text-slate-700";

                const isPromo = item['행사적용'] === 'Y';
                const promoBadge = isPromo
                    ? `<span class="px-2 py-0.5 text-xs font-semibold bg-rose-100 text-rose-700 rounded-full">행사</span>`
                    : `<span class="px-2 py-0.5 text-xs font-medium bg-slate-100 text-slate-600 rounded-full">정상</span>`;

                tr.innerHTML = `
                    <td class="py-3 px-4 font-mono text-xs font-medium text-indigo-900">${item['일자']}</td>
                    <td class="py-3 px-4">${item['점포']}</td>
                    <td class="py-3 px-4">${item['카테고리']}</td>
                    <td class="py-3 px-4 font-mono text-xs text-slate-500">${item['상품코드']}</td>
                    <td class="py-3 px-4 font-medium text-slate-900">${item['상품명']}</td>
                    <td class="py-3 px-4 text-right">₩${item['정상단가'].toLocaleString()}</td>
                    <td class="py-3 px-4 text-right font-medium">${item['판매수량'].toLocaleString()}</td>
                    <td class="py-3 px-4 text-right text-rose-600">${item['할인액'] > 0 ? '-₩' + item['할인액'].toLocaleString() : '0'}</td>
                    <td class="py-3 px-4 text-right font-bold text-slate-900">₩${item['매출액'].toLocaleString()}</td>
                    <td class="py-3 px-4 text-center">${promoBadge}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function setupEventListeners() {
            // Filters change
            document.getElementById('dateSelect').addEventListener('change', applyFilters);
            document.getElementById('storeSelect').addEventListener('change', applyFilters);
            document.getElementById('categorySelect').addEventListener('change', applyFilters);
            document.getElementById('promoSelect').addEventListener('change', applyFilters);
            document.getElementById('searchInput').addEventListener('input', applyFilters);

            // Pagination
            document.getElementById('prevPageBtn').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderTable();
                }
            });

            document.getElementById('nextPageBtn').addEventListener('click', () => {
                const totalPages = Math.ceil(filteredData.length / pageSize);
                if (currentPage < totalPages) {
                    currentPage++;
                    renderTable();
                }
            });

            // CSV Upload Listener
            document.getElementById('csvFileInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        if (results.data && results.data.length > 0) {
                            loadData(results.data);
                        } else {
                            alert('CSV 파일에 유효한 데이터가 없습니다.');
                        }
                    },
                    error: (err) => {
                        console.error("CSV Parse Error:", err);
                        alert('CSV 파일을 파싱하는데 실패했습니다.');
                    }
                });
            });

            // Reset Demo Data
            document.getElementById('resetDemoBtn').addEventListener('click', () => {
                document.getElementById('csvFileInput').value = '';
                loadData(DEFAULT_MOCK_DATA);
            });
        }
    </script>
</body>
</html>
